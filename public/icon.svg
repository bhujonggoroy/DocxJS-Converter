<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Document Card -->
  <g filter="url(#dropShadow)">
    <path d="M140 100 H300 L372 172 V412 C372 423 363 432 352 432 H140 C129 432 120 423 120 412 V120 C120 109 129 100 140 100 Z" fill="url(#docGrad)" />
    <!-- Folded Corner -->
    <path d="M300 100 V172 H372 Z" fill="#cbd5e1" opacity="0.9" />
  </g>

  <!-- Document Lines -->
  <rect x="160" y="210" width="120" height="16" rx="8" fill="#94a3b8" />
  <rect x="160" y="244" width="192" height="14" rx="7" fill="#cbd5e1" />
  <rect x="160" y="274" width="170" height="14" rx="7" fill="#cbd5e1" />

  <!-- Math & Word Badge -->
  <g transform="translate(190, 316)">
    <rect width="160" height="68" rx="16" fill="#1e40af" />
    <!-- Math symbols: W with DOCX / ∑ √x -->
    <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">.DOCX</text>
  </g>

  <!-- Floating Sparkle / AI star -->
  <path d="M390 80 L398 98 L416 106 L398 114 L390 132 L382 114 L364 106 L382 98 Z" fill="#fbbf24" />
</svg>
